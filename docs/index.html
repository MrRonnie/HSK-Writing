<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK Write</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1220;--surface:#141c2f;--surface2:#1c2740;
  --brd:#2a3654;--brd2:#3d4a6b;
  --tx:#e8edf7;--txm:#8a98b8;--txd:#5d6987;
  --accent:#5b8def;--accentH:#7aa3f5;
  --green:#4ade80;--green-bg:rgba(74,222,128,.08);
  --red:#f87171;--red-bg:rgba(248,113,113,.08);
  --amber:#fbbf24;--purple:#a78bfa;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
header{background:var(--surface);border-bottom:1px solid var(--brd);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:700;font-size:16px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo-ico{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#5b8def,#a78bfa);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff}
.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.chip{padding:4px 10px;border-radius:20px;border:1px solid var(--brd2);font-size:12px;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--txm);transition:all .15s;font-family:inherit;white-space:nowrap}
.chip:hover{color:var(--tx)}
.chip.active{color:#fff}
.chip.active.lv1{background:#1a6b3c;border-color:#4ade80}
.chip.active.lv2{background:#1a3d6b;border-color:#60a5fa}
.chip.active.lv3{background:#3b1f6b;border-color:#a78bfa}
.chip.active.lvimp{background:#4a2060;border-color:#e879f9}
.chip-x{padding:2px 6px;border-radius:12px;border:none;background:transparent;color:var(--txd);cursor:pointer;font-size:10px;margin-left:-4px;font-family:inherit}
.chip-x:hover{color:var(--red)}
.chip-import{padding:4px 10px;border-radius:20px;border:1px dashed var(--brd2);font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--txd);transition:all .15s}
.chip-import:hover{color:var(--accent);border-color:var(--accent)}
.nav{display:flex;gap:3px;margin-left:auto}
.navbtn{padding:6px 12px;border:none;background:transparent;color:var(--txm);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;transition:all .15s;font-family:inherit}
.navbtn:hover{color:var(--tx);background:var(--surface2)}
.navbtn.active{background:var(--surface2);color:var(--tx)}
.sbar{background:var(--surface);border-bottom:1px solid var(--brd);padding:6px 16px;display:flex;gap:16px;font-size:12px;color:var(--txm);flex-wrap:wrap}
.sbar b{font-weight:600}
.c-g{color:var(--green)}.c-r{color:var(--red)}.c-a{color:var(--amber)}
main{flex:1;padding:20px 16px;max-width:620px;margin:0 auto;width:100%}
.card{background:var(--surface);border:1px solid var(--brd);border-radius:16px;padding:26px 22px;margin-bottom:12px;text-align:center}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.3px}
.b1{background:rgba(74,222,128,.1);color:var(--green)}
.b2{background:rgba(96,165,250,.1);color:#60a5fa}
.b3{background:rgba(167,139,250,.1);color:var(--purple)}
.bimp{background:rgba(232,121,249,.1);color:#e879f9}
.prompt{font-size:11px;color:var(--txd);margin-top:16px;text-transform:uppercase;letter-spacing:.5px}
.play-btn{margin-top:14px;width:80px;height:80px;border-radius:50%;border:none;cursor:pointer;background:var(--accent);color:#fff;font-size:30px;display:inline-flex;align-items:center;justify-content:center;transition:all .15s}
.play-btn:hover{background:var(--accentH)}
.play-btn:active{transform:scale(.94)}
.play-lbl{font-size:11px;color:var(--txd);margin-top:8px}
.hint-btn{margin-top:16px;background:transparent;border:1px solid var(--brd2);color:var(--txm);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;transition:all .15s}
.hint-btn:hover{color:var(--tx)}
.hint-txt{margin-top:10px;color:var(--txm);font-size:14px;min-height:20px;font-style:italic}
.ans-box{margin-top:16px;min-height:74px;background:var(--bg);border:2px solid var(--brd);border-radius:12px;display:flex;align-items:center;justify-content:center;transition:border-color .2s;padding:8px}
.ans-box.correct{border-color:var(--green);background:var(--green-bg)}
.ans-box.wrong{border-color:var(--red);background:var(--red-bg)}
.ans-ch{font-size:40px;font-weight:700;letter-spacing:5px}
.ans-ph{color:var(--txd);font-size:13px}
.res-box{margin-top:12px;border-radius:12px;padding:14px 16px;text-align:left}
.res-box.correct{background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.25)}
.res-box.wrong{background:rgba(248,113,113,.06);border:1px solid rgba(248,113,113,.25)}
.res-title{font-weight:700;margin-bottom:6px;font-size:14px}
.res-box.correct .res-title{color:var(--green)}
.res-box.wrong .res-title{color:var(--red)}
.res-ch{font-size:30px;font-weight:700;letter-spacing:3px}
.res-py{font-size:14px;color:var(--txm);margin-top:2px}
.res-en{font-size:12px;color:var(--txd);margin-top:6px;line-height:1.5}
.res-pos{display:inline-block;font-size:10px;background:var(--surface2);color:var(--txm);padding:1px 6px;border-radius:4px;margin-bottom:6px;font-weight:600}
.res-next{font-size:11px;color:var(--txd);margin-top:8px}
.ime{background:var(--surface);border:1px solid var(--brd);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.ime-lbl{font-size:11px;color:var(--txd);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.ime-inp{width:100%;padding:11px 14px;background:var(--bg);border:1.5px solid var(--brd);border-radius:9px;color:var(--tx);font-size:16px;outline:none;font-family:inherit;transition:border-color .15s}
.ime-inp:focus{border-color:var(--accent)}
.cands{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.cand{background:var(--bg);border:1px solid var(--brd2);border-radius:8px;padding:7px 11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .1s;min-width:52px}
.cand:hover{background:var(--surface2);border-color:var(--accent)}
.cand-ch{font-size:21px;font-weight:600}
.cand-py{font-size:9px;color:var(--txd);font-weight:600}
.cand-empty{padding:6px 0;color:var(--txd);font-size:12px;font-style:italic}
.actions{display:flex;gap:10px;margin-bottom:20px}
.btn{flex:1;padding:13px;border:none;border-radius:11px;cursor:pointer;font-size:14px;font-weight:700;font-family:inherit;transition:all .15s}
.btn:disabled{opacity:.35;cursor:not-allowed}
.bp{background:var(--accent);color:#fff}.bp:hover:not(:disabled){background:var(--accentH)}
.bs{background:var(--surface2);color:var(--txm);flex:0 0 auto;padding:13px 16px}.bs:hover{color:var(--tx)}
.bnc{background:rgba(74,222,128,.12);color:var(--green);border:1px solid rgba(74,222,128,.25)}
.bnw{background:var(--accent);color:#fff}
.bsk{background:transparent;color:var(--txd);border:1px solid var(--brd)}.bsk:hover{color:var(--txm)}
.stats-wrap{max-width:740px;margin:0 auto}
.sh{font-size:13px;font-weight:700;color:var(--txm);margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:20px}
.metric{background:var(--surface);border:1px solid var(--brd);border-radius:12px;padding:14px}
.ml{font-size:11px;color:var(--txd);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.mv{font-size:21px;font-weight:700}
.mof{font-size:13px;color:var(--txd)}
.pw{background:var(--surface);border:1px solid var(--brd);border-radius:12px;padding:16px;margin-bottom:10px}
.pt{background:var(--bg);border-radius:6px;height:8px;overflow:hidden;margin-top:10px}
.pf{height:100%;border-radius:6px;transition:width .4s}
.pf1{background:linear-gradient(90deg,#4ade80,#22c55e)}
.pf2{background:linear-gradient(90deg,#60a5fa,#3b82f6)}
.pf3{background:linear-gradient(90deg,#a78bfa,#7c3aed)}
.pfi{background:linear-gradient(90deg,#e879f9,#9333ea)}
.pm{display:flex;justify-content:space-between;font-size:12px;color:var(--txm);margin-top:6px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.wcard{background:var(--surface);border:1px solid var(--brd);border-radius:10px;padding:12px;transition:border-color .15s}
.wcard.due{border-color:rgba(251,191,36,.4)}
.wcard.mastered{border-color:rgba(74,222,128,.3)}
.wch{font-size:21px;font-weight:700;margin-bottom:2px}
.wpy{font-size:11px;color:var(--txm)}
.wen{font-size:10px;color:var(--txd);margin-top:4px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wtags{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600}
.tc{background:rgba(74,222,128,.12);color:var(--green)}
.tw{background:rgba(248,113,113,.12);color:var(--red)}
.tnew{color:var(--txd);font-size:10px;font-weight:600}
.tdue{background:rgba(251,191,36,.12);color:var(--amber);font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600}
.tmas{background:rgba(74,222,128,.12);color:var(--green);font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600}
.reset-btn{margin-top:20px;background:transparent;color:var(--red);border:1px solid rgba(248,113,113,.25);padding:8px 16px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:13px;display:block}
.reset-btn:hover{background:var(--red-bg)}
.imp-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:100}
.imp-card{background:var(--surface);border:1px solid var(--brd);border-radius:16px;padding:28px;max-width:380px;width:90%;text-align:center}
.imp-title{font-size:17px;font-weight:700;margin-bottom:8px}
.imp-sub{font-size:13px;color:var(--txm);margin-bottom:20px;line-height:1.5}
.imp-prog{font-size:13px;color:var(--accent);margin-top:12px;min-height:20px}
.empty{text-align:center;padding:60px 20px;color:var(--txm);font-size:14px}
@media(max-width:500px){.ans-ch{font-size:32px}.logo{font-size:14px}main{padding:14px 10px}header{padding:8px 10px}}
/* Simple footer */
.simple-footer {
  text-align: center;
  padding: 24px 16px 20px;
  margin-top: 32px;
  border-top: 1px solid var(--brd);
  font-size: 12px;
  color: var(--txd);
  background: var(--surface);
}
.simple-footer div {
  margin: 4px 0;
}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-ico">写</div>HSK Write</div>
  <div class="chips" id="chips"></div>
  <nav class="nav">
    <button class="navbtn active" id="navQ" onclick="setView('quiz')">Practice</button>
    <button class="navbtn" id="navS" onclick="setView('stats')">Progress</button>
  </nav>
</header>
<div class="sbar" id="sbar"></div>
<main id="main"></main>
<footer style="
  text-align: center;
  padding: 20px 16px 24px;
  font-size: 12px;
  color: var(--txd);
  border-top: 1px solid var(--brd);
  margin-top: 24px;
">
   <div>Made With Love ❤️ By Ronnie</div>
  <div>Copyright © <span id="year"></span> - All rights reserved</div>
</footer>
<div id="impModal" style="display:none"></div>

n","plain":"ren","en":"person; man; people","pos":"noun","audio":"ren2.mp3"},{"ch":"那","py":"nà","plain":"na","en":"that; then","pos":"pronoun","audio":"na4.mp3"},{"ch":"来","py":"lái","plain":"lai","en":"come; arrive; ever since; next","pos":"directional locality","audio":"lai2.mp3"},{"ch":"都","py":"dōu","plain":"dou","en":"all; both","pos":"adverb","audio":"dou1.mp3"},{"ch":"个","py":"ge","plain":"ge","en":"general measure word","pos":"classifier","audio":"ge.mp3"},{"ch":"能","py":"néng","plain":"neng","en":"can; be able","pos":"verb","audio":"neng2.mp3"},{"ch":"去","py":"qù","plain":"qu","en":"go; to leave","pos":"verb","audio":"qu4.mp3"},{"ch":"和","py":"hé","plain":"he","en":"and; with","pos":"conjunction","audio":"he2.mp3"},{"ch":"做","py":"zuò","plain":"zuo","en":"do; make","pos":"verb","audio":"zuo4.mp3"},{"ch":"上","py":"shàng","plain":"shang","en":"above; up","pos":"directional locality","audio":"shang4.mp3"},{"ch":"没有","py":"méiyǒu","plain":"mei you","en":"not have; there is not","pos":"verb","audio":"mei2you3.mp3"},{"ch":"看","py":"kàn","plain":"kan","en":"see; look at; to watch","pos":"verb","audio":"kan4.mp3"},{"ch":"怎么","py":"zěnme","plain":"zen me","en":"how?;&nbsp;what","pos":"pronoun","audio":"zen3me.mp3"},{"ch":"现在","py":"xiànzài","plain":"xian zai","en":"now","pos":"time word","audio":"xian4zai4.mp3"},{"ch":"点","py":"diǎn","plain":"dian","en":"a dot; a little; o'clock","pos":"time word","audio":"dian3.mp3"},{"ch":"呢","py":"ne","plain":"ne","en":"indicates a question; how about...?; indicating continued state or action","pos":"modal particle","audio":"ne.mp3"},{"ch":"太","py":"tài","plain":"tai","en":"too (much)","pos":"adverb","audio":"tai4.mp3"},{"ch":"里","py":"lǐ","plain":"li","en":"inside; Chinese mile (~.5 km)","pos":"directional locality","audio":"li3.mp3"},{"ch":"听","py":"tīng","plain":"ting","en":"listen; hear","pos":"verb","audio":"ting1.mp3"},{"ch":"谁","py":"shéi","plain":"shei","en":"who","pos":"pronoun","audio":"shei2.mp3"},{"ch":"多","py":"duō" const BUILTIN={1:B1,2:B2,3:B3};
const SRS=[1,2,4,7,14,30,90];
const PKEY='hsk_prog_v3', IKEY='hsk_imp_v2';
let actLvl=[1,2,3], impDecks={}, actImp=[];
let progress={}, view='quiz';
let quiz=null, answer='', pinyin='', result=null, hint=false, played=false;
let sC=0, sW=0, audioObj=null, audioDB=null, audioCache={};
let sqlJs=null, importing=false;

function loadState(){
  try{progress=JSON.parse(localStorage.getItem(PKEY)||'{}');}catch(e){}
  try{impDecks=JSON.parse(localStorage.getItem(IKEY)||'{}');actImp=Object.keys(impDecks);}catch(e){}
}
function saveProg(){try{localStorage.setItem(PKEY,JSON.stringify(progress));}catch(e){}}
function saveImp(){try{localStorage.setItem(IKEY,JSON.stringify(impDecks));}catch(e){}}

async function openADB(){
  if(audioDB)return audioDB;
  return new Promise(r=>{
    const req=indexedDB.open('hsk_audio_v2',1);
    req.onupgradeneeded=e=>e.target.result.createObjectStore('b');
    req.onsuccess=e=>{audioDB=e.target.result;r(audioDB);};
    req.onerror=()=>r(null);
  });
}
async function storeBlob(name,blob){
  const db=await openADB();if(!db)return;
  return new Promise(r=>{const tx=db.transaction('b','readwrite');tx.objectStore('b').put(blob,name);tx.oncomplete=r;tx.onerror=r;});
}
async function getBlob(name){
  if(audioCache[name])return audioCache[name];
  const db=await openADB();if(!db)return null;
  return new Promise(r=>{
    const req=db.transaction('b','readonly').objectStore('b').get(name);
    req.onsuccess=e=>{
      if(e.target.result){const u=URL.createObjectURL(e.target.result);audioCache[name]=u;r(u);}
      else r(null);
    };
    req.onerror=()=>r(null);
  });
}

async function playWord(w){
  if(audioObj){audioObj.pause();audioObj=null;}
  let src=null;
  if(w._imp){src=await getBlob(w.audio);}
  else if(w.audio){src='audio/'+w.audio;}
  if(src){audioObj=new Audio(src);audioObj.play().catch(()=>tts(w.ch));}
  else tts(w.ch);
}
function tts(t){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=0.8;
  window.speechSynthesis.speak(u);
}

function getVocab(){
  let r=[];
  actLvl.forEach(l=>{if(BUILTIN[l])r=r.concat(BUILTIN[l].map(w=>({...w,_lvl:l})));});
  actImp.forEach(n=>{if(impDecks[n])r=r.concat(impDecks[n].map(w=>({...w,_imp:true,_dn:n})));});
  return r;
}

function isDue(c){return !c||!c.nr||new Date()>=new Date(c.nr);}
function ni(cur,ok){if(!ok)return 1;const i=SRS.indexOf(cur);return SRS[Math.min(i<0?0:i+1,SRS.length-1)];}

function pick(){
  const vocab=getVocab();if(!vocab.length){quiz=null;return;}
  const due=vocab.filter(w=>isDue(progress[w.ch]));
  const src=due.length?due:vocab;
  const top=src.slice(0,Math.min(src.length,25));
  quiz=top[Math.floor(Math.random()*top.length)];
  answer='';pinyin='';result=null;hint=false;played=false;
}

function cands(inp){
  const raw=inp.toLowerCase().trim();if(!raw)return[];
  const ns=raw.replace(/\s+/g,'');
  return getVocab().filter(w=>{
    const p=(w.plain||'').toLowerCase();
    return p.startsWith(raw)||p.replace(/\s+/g,'').startsWith(ns);
  }).sort((a,b)=>(a.plain||'').length-(b.plain||'').length).slice(0,10);
}

function setView(v){
  view=v;
  document.getElementById('navQ').className='navbtn'+(v==='quiz'?' active':'');
  document.getElementById('navS').className='navbtn'+(v==='stats'?' active':'');
  render();
}

function toggleLvl(l){
  if(actLvl.includes(l)){if(actLvl.length+actImp.length<=1)return;actLvl=actLvl.filter(x=>x!==l);}
  else actLvl=[...actLvl,l].sort();
  pick();rChips();rBar();render();
}
function toggleImp(n){
  if(actImp.includes(n)){if(actLvl.length+actImp.length<=1)return;actImp=actImp.filter(x=>x!==n);}
  else actImp=[...actImp,n];
  pick();rChips();rBar();render();
}
function removeImp(n){
  if(!confirm('Remove deck "'+n+'"?\nProgress for those cards is kept.'))return;
  delete impDecks[n];actImp=actImp.filter(x=>x!==n);
  saveImp();pick();rChips();rBar();render();
}

function rChips(){
  const el=document.getElementById('chips');
  let h=[1,2,3].map(l=>{
    const cls='chip'+(actLvl.includes(l)?' active lv'+l:'');
    return `<button class="${cls}" onclick="toggleLvl(${l})">HSK ${l}</button>`;
  }).join('');
  Object.keys(impDecks).forEach(n=>{
    const s=n.length>14?n.slice(0,14)+'…':n;
    const cls='chip'+(actImp.includes(n)?' active lvimp':'');
    h+=`<button class="${cls}" onclick="toggleImp('${n.replace(/'/g,"\'")}')">📦 ${s}</button>`;
    h+=`<button class="chip-x" onclick="removeImp('${n.replace(/'/g,"\'")}')">✕</button>`;
  });
  h+=`<label class="chip chip-import">+ Import deck<input type="file" accept=".apkg" style="display:none" onchange="startImport(this.files[0]);this.value=''"></label>`;
  el.innerHTML=h;
}

function rBar(){
  const v=getVocab();
  const due=v.filter(w=>isDue(progress[w.ch])).length;
  const stud=v.filter(w=>progress[w.ch]).length;
  const mast=v.filter(w=>progress[w.ch]&&progress[w.ch].iv>=30).length;
  document.getElementById('sbar').innerHTML=
    `<span>Session: <b class="c-g">✓ ${sC}</b> · <b class="c-r">✗ ${sW}</b></span>`+
    `<span>Due: <b class="c-a">${due}</b></span>`+
    `<span>Studied: <b>${stud} / ${v.length}</b></span>`+
    `<span>Mastered: <b class="c-g">${mast}</b></span>`;
}

function eh(s){return(s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);}

function render(){view==='quiz'?rQuiz():rStats();}

function rQuiz(){
  const m=document.getElementById('main');
  const vocab=getVocab();
  if(!vocab.length){m.innerHTML='<div class="empty">No levels selected. Enable some above.</div>';return;}
  if(!quiz)pick();
  const cs=pinyin?cands(pinyin):[];
  const c=progress[quiz.ch];
  const lvlLbl=quiz._imp?eh(quiz._dn||'Imported'):'HSK '+quiz._lvl;
  const badgeCls=quiz._imp?'bimp':'b'+quiz._lvl;

  let h=`<div class="card">`;
  h+=`<span class="badge ${badgeCls}">${lvlLbl}</span>`;
  h+=`<div class="prompt">Listen, then write the character</div>`;
  h+=`<button class="play-btn" onclick="playWord(quiz);played=true;document.getElementById('plbl').textContent='Tap to hear again'" aria-label="Play">🔊</button>`;
  h+=`<div class="play-lbl" id="plbl">${played?'Tap to hear again':'Tap to listen'}</div>`;
  h+=`<button class="hint-btn" onclick="hint=!hint;rQuiz()">${hint?'Hide hint':'Show English hint'}</button>`;
  h+=`<div class="hint-txt">${hint?eh(quiz.en):''}</div>`;
  h+=`<div class="ans-box${result?' '+result:''}">`;
  h+=answer?`<span class="ans-ch">${eh(answer)}</span>`:`<span class="ans-ph">Type pinyin below, then pick the character</span>`;
  h+=`</div>`;
  if(result){
    h+=`<div class="res-box ${result}">`;
    h+=`<div class="res-title">${result==='correct'?'✓ Correct!':'✗ Incorrect'}</div>`;
    if(quiz.pos)h+=`<span class="res-pos">${eh(quiz.pos)}</span>`;
    h+=`<div class="res-ch">${eh(quiz.ch)}</div>`;
    h+=`<div class="res-py">${eh(quiz.py)}</div>`;
    h+=`<div class="res-en">${eh(quiz.en)}</div>`;
    if(c){const d=Math.max(0,Math.round((new Date(c.nr)-new Date())/86400000));h+=`<div class="res-next">Next review in ${d} day${d!==1?'s':''}</div>`;}
    h+=`</div>`;
  }
  h+=`</div>`;

  let ime='';
  if(!result){
    ime+=`<div class="ime"><div class="ime-lbl">⌨️ Type pinyin (no tones) — HSK exam style</div>`;
    ime+=`<input id="pi" class="ime-inp" type="text" placeholder="e.g. ru guo → pick 如果" value="${eh(pinyin)}" oninput="pinyin=this.value;rQuiz()" onkeydown="if(event.key==='Enter'&&answer&&!result)sub()" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="off"/>`;
    if(cs.length){
      ime+=`<div class="cands">`;
      cs.forEach(w=>{ime+=`<button class="cand" onclick="selC('${eh(w.ch)}')"><span class="cand-ch">${eh(w.ch)}</span><span class="cand-py">${eh(w.py)}</span></button>`;});
      ime+=`</div>`;
    }else if(pinyin)ime+=`<div class="cand-empty">No match found — try different spelling or check level filter</div>`;
    ime+=`</div>`;
  }

  let act=`<div class="actions">`;
  if(!result){
    act+=`<button class="btn bp" onclick="sub()" ${!answer?'disabled':''}>Check answer</button>`;
    act+=answer?`<button class="btn bs" onclick="answer='';rQuiz()">Clear</button>`:`<button class="btn bsk" onclick="pick();render()">Skip</button>`;
  }else{
    act+=`<button class="btn ${result==='correct'?'bnc':'bnw'}" onclick="pick();render()">Next card →</button>`;
  }
  act+=`</div>`;
  m.innerHTML=h+ime+act;
  if(!result){const i=document.getElementById('pi');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}
}

function selC(ch){answer=ch;pinyin='';rQuiz();setTimeout(()=>{const i=document.getElementById('pi');if(i)i.focus();},30);}

function sub(){
  if(!quiz||!answer||result)return;
  const ok=answer.trim()===quiz.ch;
  result=ok?'correct':'wrong';
  const c=progress[quiz.ch]||{c:0,w:0,iv:1};
  const niv=ni(c.iv,ok);
  const nr=new Date();nr.setDate(nr.getDate()+niv);
  progress[quiz.ch]={c:(c.c||0)+(ok?1:0),w:(c.w||0)+(ok?0:1),iv:niv,nr:nr.toISOString()};
  if(ok)sC++;else sW++;
  saveProg();rBar();rQuiz();
}

function rStats(){
  const m=document.getElementById('main');
  const vocab=getVocab();
  const stud=vocab.filter(w=>progress[w.ch]);
  const mast=vocab.filter(w=>progress[w.ch]&&progress[w.ch].iv>=30);
  const due=vocab.filter(w=>isDue(progress[w.ch]));
  let ac=0,aw=0;Object.values(progress).forEach(p=>{ac+=p.c||0;aw+=p.w||0;});
  const acc=ac+aw?Math.round(ac/(ac+aw)*100):0;
  let h='<div class="stats-wrap">';
  h+=`<p class="sh">Overview</p><div class="metrics">`;
  h+=`<div class="metric"><div class="ml">Studied</div><div class="mv">${stud.length}<span class="mof"> / ${vocab.length}</span></div></div>`;
  h+=`<div class="metric"><div class="ml">Mastered</div><div class="mv c-g">${mast.length}</div></div>`;
  h+=`<div class="metric"><div class="ml">Due now</div><div class="mv c-a">${due.length}</div></div>`;
  h+=`<div class="metric"><div class="ml">Accuracy</div><div class="mv">${acc}%</div></div>`;
  h+=`</div>`;
  [1,2,3].filter(l=>actLvl.includes(l)).forEach(l=>{
    const lw=BUILTIN[l]||[];
    const ls=lw.filter(w=>progress[w.ch]);
    const pct=lw.length?Math.round(ls.length/lw.length*100):0;
    h+=`<div class="pw"><div style="display:flex;justify-content:space-between;align-items:center"><p class="sh" style="margin:0">HSK ${l}</p><span style="font-size:12px;color:var(--txm)">${ls.length} / ${lw.length}</span></div>`;
    h+=`<div class="pt"><div class="pf pf${l}" style="width:${pct}%"></div></div><div class="pm"><span>${pct}% studied</span><span>${lw.filter(w=>progress[w.ch]&&progress[w.ch].iv>=30).length} mastered</span></div></div>`;
  });
  actImp.forEach(n=>{
    const lw=impDecks[n]||[];
    const ls=lw.filter(w=>progress[w.ch]);
    const pct=lw.length?Math.round(ls.length/lw.length*100):0;
    h+=`<div class="pw"><div style="display:flex;justify-content:space-between;align-items:center"><p class="sh" style="margin:0">📦 ${eh(n)}</p><span style="font-size:12px;color:var(--txm)">${ls.length} / ${lw.length}</span></div>`;
    h+=`<div class="pt"><div class="pf pfi" style="width:${pct}%"></div></div><div class="pm"><span>${pct}% studied</span></div></div>`;
  });
  h+=`<p class="sh" style="margin-top:20px">Cards</p><div class="wgrid">`;
  vocab.forEach(w=>{
    const c=progress[w.ch];let cls='wcard',tag='';
    if(c){if(c.iv>=30){cls+=' mastered';tag='<span class="tmas">mastered</span>';}else if(isDue(c)){cls+=' due';tag='<span class="tdue">due</span>';}}
    h+=`<div class="${cls}"><div class="wch">${eh(w.ch)}</div><div class="wpy">${eh(w.py)}</div><div class="wen">${eh(w.en)}</div>`;
    h+=`<div class="wtags">${c?`<span class="tag tc">✓${c.c}</span><span class="tag tw">✗${c.w}</span>${tag}`:'<span class="tnew">new</span>'}</div></div>`;
  });
  h+=`</div><button class="reset-btn" onclick="if(confirm('Reset ALL progress?')){progress={};saveProg();rBar();render();}">Reset all progress</button></div>`;
  m.innerHTML=h;
}

// ── DECK IMPORTER ──
async function loadSql(){
  if(sqlJs)return sqlJs;
  return new Promise((res,rej)=>{
    if(document.querySelector('script[data-sqls]'))return;
    const s=document.createElement('script');
    s.dataset.sqls='1';
    s.src='https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/sql-wasm.js';
    s.onload=async()=>{sqlJs=await initSqlJs({locateFile:f=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`});res(sqlJs);};
    s.onerror=rej;document.head.appendChild(s);
  });
}

function setImpModal(html){document.getElementById('impModal').innerHTML=html;document.getElementById('impModal').style.display=html?'block':'';}

async function startImport(file){
  if(!file)return;
  if(importing){alert('Already importing, please wait...');return;}
  importing=true;
  setImpModal(`<div class="imp-overlay"><div class="imp-card"><div class="imp-title">📦 Importing Deck</div><div class="imp-sub">${eh(file.name)}</div><div class="imp-prog" id="impProg">Reading file...</div></div></div>`);
  const prog=id=>document.getElementById('impProg').textContent=id;
  try{
    if(typeof JSZip==='undefined')throw new Error('JSZip not loaded — check internet connection');
    prog('Unzipping .apkg...');
    const zip=await JSZip.loadAsync(file);
    let mediaMap={};
    const mf=zip.file('media');
    if(mf)mediaMap=JSON.parse(await mf.async('string'));
    const n2num=Object.fromEntries(Object.entries(mediaMap).map(([n,v])=>[v,n]));
    prog('Loading SQL parser...');
    const SQL=await loadSql();
    const dbf=zip.file('collection.anki2');
    if(!dbf)throw new Error('No collection.anki2 in file — is this a valid Anki deck?');
    prog('Reading cards...');
    const buf=await dbf.async('arraybuffer');
    const db=new SQL.Database(new Uint8Array(buf));
    const res=db.exec('SELECT flds FROM notes ORDER BY id');
    db.close();
    if(!res[0])throw new Error('No notes found in deck');
    const vocab=[];const audioSet=new Set();
    for(const row of res[0].values){
      const pts=row[0].split('\x1f');if(pts.length<8)continue;
      const simp=pts[1].trim(),py=pts[3].trim(),pyn=pts[4].trim(),en=pts[5].trim(),pos=pts[6].trim(),sf=pts[7].trim();
      const am=sf.match(/\[sound:([^\]]+)\]/);
      const af=am?am[1]:null;if(af)audioSet.add(af);
      const first=pyn.split(',')[0].trim();
      const syls=[...first.matchAll(/([a-zA-Z]+)[1-5]?/g)].map(m=>m[1].toLowerCase());
      vocab.push({ch:simp,py:py.split(',')[0].trim(),plain:syls.join(' '),en,pos,audio:af});
    }
    prog(`Saving ${audioSet.size} audio files...`);
    let saved=0;
    for(const aname of audioSet){
      const num=n2num[aname];if(!num)continue;
      const entry=zip.file(num);if(!entry)continue;
      const blob=await entry.async('blob');
      await storeBlob(aname,blob);saved++;
      if(saved%20===0)prog(`Saving audio... ${saved}/${audioSet.size}`);
    }
    const deckName=file.name.replace(/\.apkg$/i,'');
    impDecks[deckName]=vocab;
    if(!actImp.includes(deckName))actImp.push(deckName);
    saveImp();setImpModal('');pick();rChips();rBar();render();
    importing=false;
    alert(`✓ Imported "${deckName}"\n${vocab.length} cards · ${saved} audio files`);
  }catch(e){
    setImpModal('');importing=false;
    alert('Import failed: '+e.message);
  }
}

loadState();
openADB();
pick();
rChips();
rBar();
render();
</script>
<script>document.getElementById('year').innerText = new Date().getFullYear();</script>
</body>
