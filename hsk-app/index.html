<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK Write — Practice Chinese characters from audio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b1220;
  --surface:#141c2f;
  --surface-2:#1c2740;
  --border:#2a3654;
  --border-strong:#3d4a6b;
  --text:#e8edf7;
  --text-mute:#8a98b8;
  --text-dim:#5d6987;
  --accent:#5b8def;
  --accent-h:#7aa3f5;
  --green:#4ade80;
  --green-bg:#0d3320;
  --red:#f87171;
  --red-bg:#3d1414;
  --amber:#fbbf24;
  --purple:#a78bfa;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}
header{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.logo{font-weight:700;font-size:17px;display:flex;align-items:center;gap:8px}
.logo-ico{
  width:28px;height:28px;border-radius:7px;
  background:linear-gradient(135deg,#5b8def 0%,#a78bfa 100%);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;color:white;
}
.nav{display:flex;gap:4px;margin-left:auto}
.navbtn{
  padding:7px 14px;border:none;background:transparent;color:var(--text-mute);
  border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;
  transition:all .15s;font-family:inherit;
}
.navbtn:hover{color:var(--text);background:var(--surface-2)}
.navbtn.active{background:var(--surface-2);color:var(--text)}
.statsbar{
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:8px 20px;
  display:flex;
  gap:20px;
  font-size:12px;
  color:var(--text-mute);
  flex-wrap:wrap;
}
.statsbar b{color:var(--text);font-weight:600}
main{flex:1;padding:24px 20px;max-width:640px;margin:0 auto;width:100%}
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  padding:28px 24px;
  margin-bottom:14px;
  text-align:center;
}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700;letter-spacing:.3px}
.badge-hsk3{background:rgba(167,139,250,.15);color:var(--purple)}
.prompt{font-size:12px;color:var(--text-dim);margin-bottom:16px;text-transform:uppercase;letter-spacing:.5px}
.play-btn{
  width:84px;height:84px;border-radius:50%;border:none;cursor:pointer;
  background:var(--accent);color:white;font-size:32px;
  display:inline-flex;align-items:center;justify-content:center;
  transition:all .15s;box-shadow:0 0 0 0 rgba(91,141,239,.4);
}
.play-btn:hover{background:var(--accent-h);box-shadow:0 0 0 8px rgba(91,141,239,.12)}
.play-btn:active{transform:scale(.95)}
.play-label{font-size:11px;color:var(--text-dim);margin-top:10px}
.hint-btn{
  margin-top:18px;background:transparent;border:1px solid var(--border-strong);
  color:var(--text-mute);padding:5px 12px;border-radius:8px;cursor:pointer;
  font-size:12px;font-family:inherit;transition:all .15s;
}
.hint-btn:hover{color:var(--text);border-color:var(--text-mute)}
.hint-text{margin-top:10px;color:var(--text-mute);font-size:14px;min-height:20px;font-style:italic}
.answer-box{
  margin-top:18px;min-height:78px;
  background:var(--bg);border:2px solid var(--border);border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .2s;padding:8px;
}
.answer-box.correct{border-color:var(--green);background:var(--green-bg)}
.answer-box.wrong{border-color:var(--red);background:var(--red-bg)}
.answer-char{font-size:42px;font-weight:700;letter-spacing:6px}
.answer-placeholder{color:var(--text-dim);font-size:13px}
.result-box{margin-top:14px;border-radius:12px;padding:14px 16px;text-align:left}
.result-box.correct{background:var(--green-bg);border:1px solid rgba(74,222,128,.3)}
.result-box.wrong{background:var(--red-bg);border:1px solid rgba(248,113,113,.3)}
.result-title{font-weight:700;margin-bottom:6px;font-size:14px}
.result-box.correct .result-title{color:var(--green)}
.result-box.wrong .result-title{color:var(--red)}
.result-ch{font-size:32px;font-weight:700;letter-spacing:3px}
.result-py{font-size:15px;color:var(--text-mute);margin-top:2px}
.result-en{font-size:12px;color:var(--text-dim);margin-top:6px;line-height:1.5}
.result-pos{display:inline-block;font-size:10px;background:var(--surface-2);color:var(--text-mute);padding:1px 6px;border-radius:4px;margin-bottom:6px;font-weight:600}
.ime-wrap{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:14px 16px;
  margin-bottom:14px;
}
.ime-label{
  font-size:11px;color:var(--text-dim);margin-bottom:10px;
  text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px;
}
.ime-input{
  width:100%;padding:12px 14px;
  background:var(--bg);border:1.5px solid var(--border);border-radius:10px;
  color:var(--text);font-size:16px;outline:none;font-family:inherit;
  transition:border-color .15s;
}
.ime-input:focus{border-color:var(--accent)}
.cand-grid{
  display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;
}
.cand-btn{
  background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;
  padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
  gap:1px;transition:all .1s;min-width:54px;
}
.cand-btn:hover{background:var(--surface-2);border-color:var(--accent)}
.cand-ch{font-size:22px;font-weight:600}
.cand-py{font-size:9px;color:var(--text-dim);font-weight:600}
.cand-empty{padding:8px;color:var(--text-dim);font-size:12px;font-style:italic}
.actions{display:flex;gap:10px;margin-bottom:24px}
.btn{
  flex:1;padding:14px;border:none;border-radius:12px;cursor:pointer;
  font-size:15px;font-weight:700;font-family:inherit;transition:all .15s;
}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:var(--accent);color:white}
.btn-primary:hover:not(:disabled){background:var(--accent-h)}
.btn-secondary{background:var(--surface-2);color:var(--text-mute);flex:0 0 auto;padding:14px 18px}
.btn-secondary:hover{color:var(--text)}
.btn-next-c{background:var(--green-bg);color:var(--green);border:1px solid rgba(74,222,128,.3)}
.btn-next-w{background:var(--accent);color:white}
.btn-skip{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
.btn-skip:hover{color:var(--text-mute);border-color:var(--text-mute)}

.stats-wrap{max-width:760px;margin:0 auto}
.stats-h{font-size:14px;font-weight:700;color:var(--text-mute);margin-bottom:14px;text-transform:uppercase;letter-spacing:.5px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:24px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px}
.metric-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.metric-val{font-size:22px;font-weight:700}
.metric-val.green{color:var(--green)}
.metric-val.amber{color:var(--amber)}
.metric-val.red{color:var(--red)}
.progress-wrap{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:24px}
.progress-track{background:var(--bg);border-radius:8px;height:10px;overflow:hidden;margin-top:10px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--purple));border-radius:8px;transition:width .4s}
.progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--text-mute);margin-top:8px}
.word-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.word-card{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  padding:12px;transition:transform .1s;
}
.word-card.due{border-color:var(--amber)}
.word-card.mastered{border-color:rgba(74,222,128,.3)}
.wc-ch{font-size:22px;font-weight:700;margin-bottom:2px}
.wc-py{font-size:12px;color:var(--text-mute)}
.wc-en{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wc-stats{display:flex;gap:5px;margin-top:8px}
.tag{font-size:10px;padding:2px 6px;border-radius:4px;font-weight:600}
.tag-c{background:rgba(74,222,128,.15);color:var(--green)}
.tag-w{background:rgba(248,113,113,.15);color:var(--red)}
.tag-new{color:var(--text-dim);font-size:10px}
.tag-due{background:rgba(251,191,36,.15);color:var(--amber);font-size:10px;padding:2px 6px;border-radius:4px}
.tag-mastered{background:rgba(74,222,128,.15);color:var(--green);font-size:10px;padding:2px 6px;border-radius:4px}
.empty{text-align:center;padding:60px 20px;color:var(--text-mute)}
.empty-ico{font-size:48px;margin-bottom:16px}
.reset-btn{
  margin-top:20px;background:transparent;color:var(--red);
  border:1px solid rgba(248,113,113,.3);padding:8px 16px;border-radius:8px;
  cursor:pointer;font-family:inherit;font-size:13px;
}
.reset-btn:hover{background:var(--red-bg)}
@media (max-width:520px){
  .answer-char{font-size:34px;letter-spacing:4px}
  main{padding:16px 12px}
  header{padding:10px 14px;gap:8px}
  .logo{font-size:15px}
  .play-btn{width:72px;height:72px;font-size:26px}
}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="logo-ico">写</div>
    HSK Write
  </div>
  <nav class="nav">
    <button class="navbtn active" id="navQuiz" onclick="setView('quiz')">Practice</button>
    <button class="navbtn" id="navStats" onclick="setView('stats')">Progress</button>
  </nav>
</header>
<div class="statsbar" id="statsbar"></div>
<main id="main"></main>

const SRS=[1,2,4,7,14,30,90];
const STORE_KEY='hsk_write_v1';
let progress={};
let view='quiz', quiz=null, answer='', pinyinInput='', result=null, showHint=false, hasPlayed=false;
let sessCorrect=0, sessWrong=0;
let audioObj=null;

function loadProgress(){try{const s=localStorage.getItem(STORE_KEY);if(s)progress=JSON.parse(s);}catch(e){}}
function saveProgress(){try{localStorage.setItem(STORE_KEY,JSON.stringify(progress));}catch(e){}}
function isDue(c){return !c||!c.nextReview||new Date()>=new Date(c.nextReview);}
function nextInterval(cur,ok){if(!ok)return 1;const i=SRS.indexOf(cur);return SRS[Math.min(i<0?0:i+1,SRS.length-1)];}

function speak(word){
  if(audioObj){audioObj.pause();audioObj=null;}
  if(word.audio){
    audioObj=new Audio('audio/'+word.audio);
    audioObj.play().catch(()=>fallbackTTS(word.ch));
  } else fallbackTTS(word.ch);
}
function fallbackTTS(text){
  if(!window.speechSynthesis)return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN';u.rate=0.8;
  window.speechSynthesis.speak(u);
}

function findCandidates(input){
  const raw=input.toLowerCase().trim();
  if(!raw)return[];
  const noSp=raw.replace(/\s+/g,'');
  return VOCAB.filter(w=>{
    const p=(w.plain||'').toLowerCase();
    return p.startsWith(raw)||p.replace(/\s+/g,'').startsWith(noSp);
  }).sort((a,b)=>(a.plain||'').length-(b.plain||'').length).slice(0,10);
}

function pickNextWord(){
  const due=VOCAB.filter(w=>isDue(progress[w.ch]));
  const src=due.length?due:VOCAB;
  // Randomize from first 15 for variety
  const top=src.slice(0,Math.min(src.length,20));
  quiz=top[Math.floor(Math.random()*top.length)];
  answer='';pinyinInput='';result=null;showHint=false;hasPlayed=false;
}

function setView(v){
  view=v;
  document.getElementById('navQuiz').className='navbtn'+(v==='quiz'?' active':'');
  document.getElementById('navStats').className='navbtn'+(v==='stats'?' active':'');
  render();
}

function renderStatsbar(){
  const due=VOCAB.filter(w=>isDue(progress[w.ch])).length;
  const studied=Object.keys(progress).length;
  const mastered=Object.values(progress).filter(p=>p.interval>=30).length;
  document.getElementById('statsbar').innerHTML=
    `<span>Session: <b style="color:var(--green)">✓ ${sessCorrect}</b> · <b style="color:var(--red)">✗ ${sessWrong}</b></span>`+
    `<span>Due today: <b style="color:var(--amber)">${due}</b></span>`+
    `<span>Studied: <b>${studied}</b> / ${VOCAB.length}</span>`+
    `<span>Mastered: <b style="color:var(--green)">${mastered}</b></span>`;
}

function selectCandidate(ch){
  const w=VOCAB.find(v=>v.ch===ch);
  if(!w)return;
  answer=w.ch;pinyinInput='';
  render();
  setTimeout(()=>{const i=document.getElementById('pi');if(i)i.focus();},30);
}

function onPinyin(val){pinyinInput=val;renderQuiz();}
function clearAns(){answer='';renderQuiz();}

function submit(){
  if(!quiz||!answer||result)return;
  const ok=answer.trim()===quiz.ch;
  result=ok?'correct':'wrong';
  const c=progress[quiz.ch]||{c:0,w:0,interval:1};
  const ni=nextInterval(c.interval,ok);
  const nr=new Date();nr.setDate(nr.getDate()+ni);
  progress[quiz.ch]={c:(c.c||0)+(ok?1:0),w:(c.w||0)+(ok?0:1),interval:ni,nextReview:nr.toISOString()};
  if(ok)sessCorrect++;else sessWrong++;
  saveProgress();renderStatsbar();renderQuiz();
}

function nextCard(){pickNextWord();renderQuiz();}
function skip(){pickNextWord();renderQuiz();}

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);}

function renderQuiz(){
  const main=document.getElementById('main');
  if(!quiz){main.innerHTML='<div class="empty">No cards available.</div>';return;}
  
  const cands=pinyinInput?findCandidates(pinyinInput):[];
  const card=progress[quiz.ch];
  
  let cardHtml='';
  cardHtml+=`<div class="card">`;
  cardHtml+=`<span class="badge badge-hsk3">HSK 3</span>`;
  cardHtml+=`<div class="prompt" style="margin-top:18px">Listen, then write the character</div>`;
  cardHtml+=`<button class="play-btn" onclick="speak(quiz);hasPlayed=true;document.getElementById('plbl').textContent='Tap to hear again'" aria-label="Play audio">🔊</button>`;
  cardHtml+=`<div class="play-label" id="plbl">${hasPlayed?'Tap to hear again':'Tap to listen'}</div>`;
  cardHtml+=`<button class="hint-btn" onclick="showHint=!showHint;renderQuiz()">${showHint?'Hide hint':'Show English hint'}</button>`;
  cardHtml+=`<div class="hint-text">${showHint?escapeHtml(quiz.en):''}</div>`;
  
  const ansCls='answer-box'+(result?' '+result:'');
  cardHtml+=`<div class="${ansCls}">`;
  cardHtml+=answer?`<span class="answer-char">${escapeHtml(answer)}</span>`:`<span class="answer-placeholder">Type pinyin below, then pick the character</span>`;
  cardHtml+=`</div>`;
  
  if(result){
    cardHtml+=`<div class="result-box ${result}">`;
    cardHtml+=`<div class="result-title">${result==='correct'?'✓ Correct!':'✗ Incorrect'}</div>`;
    cardHtml+=`<span class="result-pos">${escapeHtml(quiz.pos||'')}</span>`;
    cardHtml+=`<div class="result-ch">${escapeHtml(quiz.ch)}</div>`;
    cardHtml+=`<div class="result-py">${escapeHtml(quiz.py)}</div>`;
    cardHtml+=`<div class="result-en">${escapeHtml(quiz.en)}</div>`;
    if(card){
      const reviewDays=Math.round((new Date(card.nextReview)-new Date())/86400000);
      cardHtml+=`<div class="result-en" style="margin-top:8px">Next review: in ${Math.max(reviewDays,0)} day(s)</div>`;
    }
    cardHtml+=`</div>`;
  }
  cardHtml+=`</div>`;
  
  let imeHtml='';
  if(!result){
    imeHtml+=`<div class="ime-wrap">`;
    imeHtml+=`<div class="ime-label">⌨️ Type pinyin (no tones needed) — HSK exam style</div>`;
    imeHtml+=`<input id="pi" class="ime-input" type="text" placeholder="e.g. ru guo → pick 如果" value="${escapeHtml(pinyinInput)}" oninput="onPinyin(this.value)" onkeydown="if(event.key==='Enter'){if(answer&&!result)submit();}" autocomplete="off" autocorrect="off" spellcheck="false" autocapitalize="off"/>`;
    if(cands.length){
      imeHtml+=`<div class="cand-grid">`;
      cands.forEach(w=>{
        imeHtml+=`<button class="cand-btn" onclick="selectCandidate('${escapeHtml(w.ch)}')"><span class="cand-ch">${escapeHtml(w.ch)}</span><span class="cand-py">${escapeHtml(w.py)}</span></button>`;
      });
      imeHtml+=`</div>`;
    } else if(pinyinInput){
      imeHtml+=`<div class="cand-empty">No match in HSK 3 deck.</div>`;
    }
    imeHtml+=`</div>`;
  }
  
  let actHtml='<div class="actions">';
  if(!result){
    actHtml+=`<button class="btn btn-primary" onclick="submit()" ${!answer?'disabled':''}>Check answer</button>`;
    if(answer)actHtml+=`<button class="btn btn-secondary" onclick="clearAns()">Clear</button>`;
    else actHtml+=`<button class="btn btn-skip" onclick="skip()">Skip</button>`;
  } else {
    actHtml+=`<button class="btn ${result==='correct'?'btn-next-c':'btn-next-w'}" onclick="nextCard()">Next card →</button>`;
  }
  actHtml+='</div>';
  
  main.innerHTML=cardHtml+imeHtml+actHtml;
  
  if(!result){
    const inp=document.getElementById('pi');
    if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}
  }
}

function renderStats(){
  const main=document.getElementById('main');
  const studied=Object.keys(progress).length;
  const mastered=Object.values(progress).filter(p=>p.interval>=30).length;
  const due=VOCAB.filter(w=>isDue(progress[w.ch])).length;
  const accuracy=(()=>{
    let c=0,w=0;
    Object.values(progress).forEach(p=>{c+=p.c||0;w+=p.w||0;});
    return c+w?Math.round(c/(c+w)*100):0;
  })();
  
  let html='<div class="stats-wrap">';
  html+=`<p class="stats-h">Overview</p>`;
  html+=`<div class="metrics">`;
  html+=`<div class="metric"><div class="metric-label">Studied</div><div class="metric-val">${studied}<span style="font-size:14px;color:var(--text-dim)"> / ${VOCAB.length}</span></div></div>`;
  html+=`<div class="metric"><div class="metric-label">Mastered</div><div class="metric-val green">${mastered}</div></div>`;
  html+=`<div class="metric"><div class="metric-label">Due now</div><div class="metric-val amber">${due}</div></div>`;
  html+=`<div class="metric"><div class="metric-label">Accuracy</div><div class="metric-val">${accuracy}%</div></div>`;
  html+=`</div>`;
  
  html+=`<div class="progress-wrap">`;
  html+=`<p class="stats-h" style="margin-bottom:0">HSK 3 progress</p>`;
  html+=`<div class="progress-track"><div class="progress-fill" style="width:${(studied/VOCAB.length)*100}%"></div></div>`;
  html+=`<div class="progress-meta"><span>${studied} of ${VOCAB.length} cards</span><span>${Math.round(studied/VOCAB.length*100)}%</span></div>`;
  html+=`</div>`;
  
  html+=`<p class="stats-h">All cards</p>`;
  html+=`<div class="word-grid">`;
  VOCAB.forEach(w=>{
    const c=progress[w.ch];
    let cls='word-card';
    let tag='';
    if(c){
      if(c.interval>=30){cls+=' mastered';tag='<span class="tag-mastered">mastered</span>';}
      else if(isDue(c)){cls+=' due';tag='<span class="tag-due">due</span>';}
    }
    html+=`<div class="${cls}">`;
    html+=`<div class="wc-ch">${escapeHtml(w.ch)}</div>`;
    html+=`<div class="wc-py">${escapeHtml(w.py)}</div>`;
    html+=`<div class="wc-en">${escapeHtml(w.en)}</div>`;
    html+=`<div class="wc-stats">${c?`<span class="tag tag-c">✓${c.c}</span><span class="tag tag-w">✗${c.w}</span>${tag}`:`<span class="tag-new">new</span>`}</div>`;
    html+=`</div>`;
  });
  html+=`</div>`;
  
  html+=`<button class="reset-btn" onclick="if(confirm('Reset all progress? This cannot be undone.')){progress={};saveProgress();renderStatsbar();render();}">Reset all progress</button>`;
  html+=`</div>`;
  
  main.innerHTML=html;
}

function render(){view==='quiz'?renderQuiz():renderStats();}

loadProgress();
pickNextWord();
renderStatsbar();
render();
</script>
</body>
</html>
